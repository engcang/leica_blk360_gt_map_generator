name: macOS manual placement

on:
  push:
    branches: [mac]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placement:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build without registration submodules or Python packages
        run: |
          if ! ./Start-BLK-Studio-Mac.command --no-launch; then
            python3 - <<'PYLOG'
          from pathlib import Path
          path = Path('build/mac-setup.log')
          log = path.read_text(errors='replace') if path.exists() else 'Launcher failed before the build started.'
          tail = '\n'.join(log.splitlines()[-100:])[-18000:]
          print('::error::' + tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYLOG
            exit 1
          fi
      - name: Save, reopen, and relocate placements
        run: |
          python3 tests/mac_placement_smoke.py --executable install-mac/blk_studio
          python3 tests/mac_placement_smoke.py --executable install-mac/blk_studio_rgb --rgb
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build/mac-setup.log
