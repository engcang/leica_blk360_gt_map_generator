<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Chunk review · BLK Studio</title>
    <link rel="stylesheet" href="html_source/result_manager.css">
    <link rel="stylesheet" href="html_source/chunks_review.css">
    <script src="html_source/chunks_review.js" defer></script>
</head>
<body>
    <h1>Chunk review</h1>
    <p><span id="summary"></span> · <a href="#cloud-section">3D view</a> · <a href="#alignment">Alignment and station positions</a></p>
    <section id="cloud-section">
        <div class="chunk-toolbar">
            <label>Chunk <select id="chunk-select"></select></label>
            <button id="previous-chunk" aria-label="Previous chunk">Previous</button>
            <button id="next-chunk" aria-label="Next chunk">Next</button>
            <a id="open-view" class="button-link" target="_blank" rel="noopener">Open 3D view</a>
        </div>
        <p id="chunk-summary"></p>
        <iframe id="chunk-view" title="Selected chunk 3D viewer"></iframe>
    </section>
    <section id="alignment">
        <h2>Alignment and station positions</h2>
        <div class="chunk-toolbar">
            <label>Height level <select id="level-select"><option value="all">All levels</option></select></label>
            <span id="level-summary"></span>
        </div>
        <div class="station-table"><table><thead><tr><th>Station</th><th>Scan</th><th>Height level</th><th>Relative height (m)</th></tr></thead><tbody id="stations"></tbody></table></div>
        <div id="alignment-images"></div>
    </section>
    <script id="chunk-data" type="application/json">__CHUNKS_JSON__</script>
</body>
</html>
