name: Build and test
on:
    push:
    pull_request:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, windows-2022]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - name: Install native build tools (Linux)
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1 libgomp1
            - uses: msys2/setup-msys2@v2
              if: runner.os == 'Windows'
              with:
                  msystem: CLANG64
                  update: true
                  install: >-
                      mingw-w64-clang-x86_64-toolchain
                      mingw-w64-clang-x86_64-cmake
                      mingw-w64-clang-x86_64-ninja
            - name: Build registration engine (Linux)
              if: runner.os == 'Linux'
              run: |
                  cmake -S mapping/native -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release
                  cmake --build build-native --parallel 4
                  cmake --install build-native --prefix .
            - name: Build registration engine (Windows)
              if: runner.os == 'Windows'
              shell: msys2 {0}
              run: |
                  cmake -S mapping/native -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_RC_COMPILER=windres
                  cmake --build build-native --parallel 4
                  cmake --install build-native --prefix .
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - name: Test registration, native engines, and metrics
              run: |
                  python -m pip install -r mapping/requirements.txt
                  python -m unittest discover -s mapping -p "test_*.py"
            - name: Configure
              run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            - name: Build
              run: cmake --build build --config Release --parallel
            - name: Test
              run: ctest --test-dir build -C Release --output-on-failure
            - name: Install
              run: cmake --install build --config Release --prefix install
    style:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - run: python -m pip install pre-commit
            - run: pre-commit run --all-files
